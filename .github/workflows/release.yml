name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYSTD_TAG: "20240814"
  PYSTD_VER: "3.11.9"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            asset_label: windows
          - platform: macos-14
            args: "--target aarch64-apple-darwin"
            asset_label: macos-arm64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75

    env:
      REF_NAME: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust target
        if: matrix.platform == 'macos-14'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      # ─────────────────────────── Windows resources ───────────────────────────
      - name: Prepare Windows portable resources
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $portable = "tauri-app/src-tauri/resources/portable"
          New-Item -ItemType Directory -Force -Path "$portable/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portable/runtime/python" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portable/templates" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portable/static" | Out-Null

          Copy-Item app.py, history.py, updater.py, settings_store.py, subscriptions.py -Destination $portable
          Copy-Item templates/*.html -Destination "$portable/templates/"
          Copy-Item static/* -Destination "$portable/static/" -Recurse

          $pyUrl = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          Invoke-WebRequest $pyUrl -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath "$portable/runtime/python" -Force

          $pthFile = Get-ChildItem "$portable/runtime/python/python*._pth" | Select-Object -First 1
          @"
          python311.zip
          .
          ..\..

          import site
          Lib\site-packages
          "@ | Set-Content -Path $pthFile.FullName -Encoding ascii

          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile "$portable/runtime/python/get-pip.py"
          & "$portable/runtime/python/python.exe" "$portable/runtime/python/get-pip.py" --no-warn-script-location
          & "$portable/runtime/python/python.exe" -m pip install --no-warn-script-location flask requests

          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$portable/bin/yt-dlp.exe"

          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $ffmpegBin = Get-ChildItem ffmpeg-extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffmpegDir = $ffmpegBin.Directory.FullName
          Copy-Item "$ffmpegDir/ffmpeg.exe" "$portable/bin/"
          Copy-Item "$ffmpegDir/ffprobe.exe" "$portable/bin/"

          $denoUrl = "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $denoUrl -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath "$portable/bin" -Force

          Get-ChildItem $portable -Recurse | Measure-Object -Property Length -Sum |
            ForEach-Object { "Total: {0:N1} MB" -f ($_.Sum / 1MB) }

      # ─────────────────────────── macOS resources ─────────────────────────────
      - name: Prepare macOS portable resources
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          portable="tauri-app/src-tauri/resources/portable"
          mkdir -p "$portable/bin" "$portable/runtime" "$portable/templates" "$portable/static" "$portable/site-packages"

          echo "▶ Copy Python sources"
          cp app.py history.py updater.py settings_store.py subscriptions.py "$portable/"
          cp templates/*.html "$portable/templates/"
          cp -R static/* "$portable/static/"

          echo "▶ Download python-build-standalone (aarch64 Apple Silicon)"
          PYURL="https://github.com/indygreg/python-build-standalone/releases/download/${PYSTD_TAG}/cpython-${PYSTD_VER}+${PYSTD_TAG}-aarch64-apple-darwin-install_only.tar.gz"
          curl -fsSL "$PYURL" -o /tmp/py.tgz
          tar -xzf /tmp/py.tgz -C "$portable/runtime/"
          chmod +x "$portable/runtime/python/bin/python3"
          "$portable/runtime/python/bin/python3" --version

          echo "▶ Install Flask + requests"
          "$portable/runtime/python/bin/python3" -m pip install --target "$portable/site-packages" --no-warn-script-location flask requests

          echo "▶ Download yt-dlp (macOS)"
          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o "$portable/bin/yt-dlp"
          chmod +x "$portable/bin/yt-dlp"

          echo "▶ Download ffmpeg + ffprobe (evermeet static)"
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o /tmp/ffmpeg.zip
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o /tmp/ffprobe.zip
          unzip -o -q /tmp/ffmpeg.zip -d "$portable/bin/"
          unzip -o -q /tmp/ffprobe.zip -d "$portable/bin/"
          chmod +x "$portable/bin/ffmpeg" "$portable/bin/ffprobe"

          echo "▶ Remove macOS quarantine flags"
          xattr -cr "$portable/bin" || true

          du -sh "$portable"

      - name: Install Tauri UI deps
        working-directory: tauri-app
        run: npm ci

      - name: Build & release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri-app
          tagName: ${{ github.ref_name }}
          releaseName: "유튜브 다운로더 ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
