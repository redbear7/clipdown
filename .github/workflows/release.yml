name: Release Windows App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      REF_NAME: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Prepare portable resources
        shell: pwsh
        run: |
          $portable = "tauri-app/src-tauri/resources/portable"
          New-Item -ItemType Directory -Force -Path "$portable/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portable/runtime/python" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portable/templates" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portable/static" | Out-Null

          Write-Host "Copying Python sources"
          Copy-Item app.py, history.py, updater.py, settings_store.py, subscriptions.py -Destination $portable
          Copy-Item templates/*.html -Destination "$portable/templates/"
          Copy-Item static/* -Destination "$portable/static/" -Recurse

          Write-Host "Downloading Python 3.11 embeddable (Win11 target)"
          $pyUrl = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          Invoke-WebRequest $pyUrl -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath "$portable/runtime/python" -Force

          Write-Host "Enabling site-packages + parent path in _pth"
          $pthFile = Get-ChildItem "$portable/runtime/python/python*._pth" | Select-Object -First 1
          @"
          python311.zip
          .
          ..\..

          import site
          Lib\site-packages
          "@ | Set-Content -Path $pthFile.FullName -Encoding ascii

          Write-Host "Installing get-pip.py"
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile "$portable/runtime/python/get-pip.py"
          & "$portable/runtime/python/python.exe" "$portable/runtime/python/get-pip.py" --no-warn-script-location

          Write-Host "Installing Flask + deps into embedded Python"
          & "$portable/runtime/python/python.exe" -m pip install --no-warn-script-location flask requests

          Write-Host "Downloading yt-dlp.exe (latest)"
          $ytdlpUrl = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          Invoke-WebRequest $ytdlpUrl -OutFile "$portable/bin/yt-dlp.exe"

          Write-Host "Downloading ffmpeg (BtbN essentials)"
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $ffmpegBin = Get-ChildItem ffmpeg-extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffmpegDir = $ffmpegBin.Directory.FullName
          Copy-Item "$ffmpegDir/ffmpeg.exe" "$portable/bin/"
          Copy-Item "$ffmpegDir/ffprobe.exe" "$portable/bin/"

          Write-Host "Downloading Deno (for yt-dlp JS runtime)"
          $denoUrl = "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest $denoUrl -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath "$portable/bin" -Force

          Write-Host "Resources ready:"
          Get-ChildItem $portable -Recurse | Measure-Object -Property Length -Sum |
            ForEach-Object { "Total: {0:N1} MB" -f ($_.Sum / 1MB) }

      - name: Install Tauri UI deps
        working-directory: tauri-app
        run: npm ci

      - name: Build Tauri app (Windows NSIS)
        working-directory: tauri-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis

      - name: Rename installer to ASCII filename
        shell: pwsh
        run: |
          $ver = $env:REF_NAME -replace '^v',''
          $bundle = "tauri-app/src-tauri/target/release/bundle/nsis"
          $ascii = "Clipdown_${ver}_x64-setup.exe"
          $installer = Get-ChildItem "$bundle/*-setup.exe" | Select-Object -First 1
          $sigFile = Get-ChildItem "$bundle/*-setup.exe.sig" | Select-Object -First 1
          Rename-Item $installer.FullName -NewName $ascii
          Rename-Item $sigFile.FullName -NewName "$ascii.sig"
          Get-ChildItem $bundle | ForEach-Object { Write-Host $_.Name ($_.Length/1MB).ToString("N1")"MB" }

      - name: Create latest.json updater manifest
        shell: pwsh
        run: |
          $ver = $env:REF_NAME -replace '^v',''
          $repo = $env:REPO
          $bundle = "tauri-app/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$bundle/*-setup.exe" | Select-Object -First 1
          $sigFile = Get-ChildItem "$bundle/*-setup.exe.sig" | Select-Object -First 1
          $sig = Get-Content $sigFile.FullName -Raw
          $now = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $installerName = $installer.Name
          $url = "https://github.com/$repo/releases/download/v$ver/$installerName"
          $manifest = @{
            version   = $ver
            notes     = "See release notes."
            pub_date  = $now
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url       = $url
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          $out = "$bundle/latest.json"
          $json | Set-Content -Path $out -Encoding utf8
          Write-Host "Wrote $out"
          Get-Content $out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "유튜브 다운로더 ${{ github.ref_name }}"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            tauri-app/src-tauri/target/release/bundle/nsis/*-setup.exe
            tauri-app/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            tauri-app/src-tauri/target/release/bundle/nsis/latest.json
